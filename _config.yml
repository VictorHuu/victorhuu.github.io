# Welcome to Jekyll!
#
# Main configuration file for the academic homepage.
# After changing this file locally, restart `jekyll serve`.

# ============================================================
# Site Settings
# ============================================================

title                    : "Yuntao Hu"
description              : "Yuntao Hu — Graduate at Tongji University"

# GitHub repository
repository               : "VictorHuu/victorhuu.github.io"

# GitHub Pages user site
url                      : "https://victorhuu.github.io"
baseurl                  : ""

# Optional locale
locale                   : "en-US"

# Google Scholar citation statistics
google_scholar_stats_use_cdn : true


# ============================================================
# Analytics
# ============================================================

# Google Analytics
# Example:
# google_analytics_id: "G-XXXXXXXXXX"
google_analytics_id      :


# ============================================================
# SEO / Search Engine Verification
# ============================================================

# Add verification IDs if you use these services.
google_site_verification :
bing_site_verification   :
baidu_site_verification  :


# ============================================================
# Site Author
# ============================================================

author:
  name             : "Yuntao Hu"

  # Path relative to site root.
  avatar           : "images/avator.jpg"

  bio              : "Agentic RL · Biological Foundational Model"

  location         : "Shanghai, China"

  employer         : "Tongji University"

  # Academic profiles
  pubmed           :

  # Replace YOUR_GOOGLE_SCHOLAR_ID with your real Scholar ID.
  # Example:
  # googlescholar: "https://scholar.google.com/citations?user=xxxxxxxxxxx"
  googlescholar    :

  researchgate     :

  dblp             :

  orcid            : "https://orcid.org/0009-0000-3554-1913"

  # Contact
  email            : "victorhu493@gmail.com"

  # Personal / social profiles
  uri              :
  github           : "VictorHuu"
  linkedin         : "yuntao-hu-victor"

  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :
  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :


# ============================================================
# Reading Files
# ============================================================

include:
  - .htaccess
  - _pages
  - files

exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gemfile.lock
  - Gruntfile.js
  - LICENSE
  - README
  - README.md
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - package-lock.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"

markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# ============================================================
# Conversion
# ============================================================

markdown: kramdown
highlighter: rouge

lsi: false
incremental: false

excerpt_separator: "\n\n"


# ============================================================
# Markdown Processing
# ============================================================

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# ============================================================
# Defaults
# ============================================================

defaults:
  # Pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true


# ============================================================
# Sass / SCSS
# ============================================================

sass:
  sass_dir: _sass
  style: compressed


# ============================================================
# Output
# ============================================================

permalink: /:categories/:title/

timezone: Asia/Shanghai


# ============================================================
# Jekyll Plugins
# ============================================================

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji


# Kept for compatibility with older Academic Pages templates.
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji


# ============================================================
# HTML Compression
# ============================================================

compress_html:
  clippings: all
  ignore:
    envs: development