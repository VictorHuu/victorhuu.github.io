<meta charset="utf-8">

{% include seo.html %}

{% comment %}
  Open Graph augmentations.
{% endcomment %}
<meta property="og:type" content="profile">
<meta property="og:title" content="{{ site.author.name | default: site.title }} — Academic homepage">
<meta property="og:description" content="{{ site.author.bio | default: site.description }}">
<meta property="og:image" content="{{ '/images/avator.png' | absolute_url }}">
<meta property="og:image:alt" content="{{ site.author.name }} portrait">
<meta property="og:locale" content="zh_CN">
<meta property="og:site_name" content="{{ site.author.name }}">

<meta property="profile:first_name" content="Yuntao">
<meta property="profile:last_name" content="Hu">

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

{% include darkmode-init.html %}

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Favicon (single PNG; sufficient for GitHub Pages) -->
<link rel="icon" type="image/png" href="{{ '/images/avator.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/avator.png' | relative_url }}">

<!-- Oxford Classic fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;700&family=Source+Serif+Pro:wght@400;600&display=swap" rel="stylesheet"> 
 
<!-- Main stylesheet --> 
<link rel="stylesheet" href="assets/css/main.css"> 
 
<meta http-equiv="cleartype" content="on">
